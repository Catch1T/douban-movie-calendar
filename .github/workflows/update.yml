name: Update Douban Calendar

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

# ✅ 修复1: 授予 Actions 写入仓库的权限（解决 exit code 128）
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ✅ 修复2: 升级到 v5 版本以消除 Node.js 20 弃用警告
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install axios ics

      - name: Generate calendar
        run: node index.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add calendar/
          git diff --staged --quiet || git commit -m "🎬 Update $(date +%Y-%m-%d)"
          git push
