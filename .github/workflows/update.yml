name: Update Douban Movie Calendar

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install axios cheerio ics

      - name: Generate calendar
        run: node index.js

      - name: Commit and push
        run: |
          echo "=== 检查生成结果 ==="
          ls -la calendar/ || echo "⚠️ calendar 目录不存在"
          
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          
          if [ -d "calendar" ]; then
            git add calendar/
            if ! git diff --staged --quiet; then
              git commit -m "🎬 Update $(date +%Y-%m-%d)"
              git push
              echo "✅ 提交并推送成功"
            else
              echo "ℹ️ 没有新的变更，跳过提交"
            fi
          else
            echo "ℹ️ calendar 目录未生成（可能没有已定档电影），跳过提交"
          fi
