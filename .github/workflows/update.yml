name: Update Douban Calendar

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install axios ics

      - name: Generate calendar
        run: node index.js

      # ✅ 修复：增加调试输出 + 安全的 git 操作
      - name: Commit & Push
        run: |
          echo "=== 检查生成结果 ==="
          ls -la calendar/ || echo "⚠️ calendar 目录不存在"
          
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          
          # 只有当 calendar 目录存在且有变更时才提交
          if [ -d "calendar" ]; then
            git add calendar/
            if ! git diff --staged --quiet; then
              git commit -m "🎬 Update $(date +%Y-%m-%d)"
              git push
              echo "✅ 提交并推送成功"
            else
              echo "ℹ️ 没有新的变更，跳过提交"
            fi
          else
            echo "❌ calendar 目录未生成，请检查上一步日志"
            exit 1
          fi
